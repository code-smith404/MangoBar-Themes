<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11151c"/>
      <stop offset=".55" stop-color="#202631"/>
      <stop offset="1" stop-color="#171a22"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#d18e70" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d18e70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#292b30" stop-opacity=".97"/>
      <stop offset="1" stop-color="#1a1c20" stop-opacity=".96"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="shadow" x="-10%" y="-40%" width="120%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="720" fill="url(#wallpaper)"/>
  <ellipse cx="330" cy="330" rx="390" ry="250" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="1120" cy="490" rx="420" ry="300" fill="#8fa8c4" opacity=".055" filter="url(#blur)"/>
  <g opacity=".11" fill="none" stroke="#c4cedd">
    <path d="M0 540C220 420 380 620 600 500s390-180 840-40"/>
    <path d="M0 565C220 445 380 645 600 525s390-180 840-40"/>
    <path d="M0 590C220 470 380 670 600 550s390-180 840-40"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, sans-serif">
    <rect x="0" y="12" width="1440" height="46" fill="url(#bar)"/>
    <path d="M0 57h1440" stroke="#ffffff" stroke-opacity=".09"/>
    <g font-size="14" font-weight="500" fill="#ececef">
      <text x="28" y="41">Workspace</text>
      <text x="121" y="41">Apps</text>
      <text x="171" y="41">Files</text>
      <text x="222" y="41">Help</text>
    </g>
    <text x="302" y="41" font-size="13" fill="#a6a9ae">Firefox — MangoBar Themes</text>

    <g font-size="13" fill="#e3e4e6">
      <path d="M1030 28l7-5 7 5v9l-7 5-7-5z" fill="none" stroke="#d9dcdf" stroke-width="1.5"/>
      <path d="M1041 28l4 3v5l-4 3" fill="none" stroke="#d9dcdf" stroke-width="1.3"/>
      <path d="M1073 29c4-6 13-6 17 0M1077 33c2-3 7-3 9 0M1081 37h1" fill="none" stroke="#e3e4e6" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M1110 27l6 11M1116 27l-6 11" stroke="#e3e4e6" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="1145" y="27" width="25" height="13" rx="3" fill="none" stroke="#e3e4e6" stroke-width="1.5"/>
      <rect x="1171" y="31" width="3" height="5" rx="1" fill="#e3e4e6"/>
      <rect x="1148" y="30" width="15" height="7" rx="1.5" fill="#e3e4e6"/>
      <text x="1185" y="40">87%</text>
      <path d="M1241 31q8-7 16 0v8q-8 6-16 0z" fill="none" stroke="#e3e4e6" stroke-width="1.5"/>
      <path d="M1260 32q5 5 0 10M1264 29q9 8 0 16" fill="none" stroke="#e3e4e6" stroke-width="1.5" stroke-linecap="round"/>
      <text x="1284" y="40">Tue Oct 20</text>
      <text x="1372" y="40" fill="#fff" font-weight="600">7:42</text>
    </g>
  </g>

  <g font-family="Inter, sans-serif" text-anchor="middle">
    <text x="720" y="316" fill="#f2f2f3" font-size="28" font-weight="500">A calmer desktop, at a glance.</text>
    <text x="720" y="352" fill="#a9adb4" font-size="15">Lumen · a dark, macOS-inspired MangoBar menu bar</text>
    <rect x="637" y="382" width="166" height="1" fill="#d18e70" opacity=".55"/>
    <text x="720" y="423" fill="#c2c5ca" font-size="13">Workspace and app actions</text>
    <text x="720" y="448" fill="#c2c5ca" font-size="13">Wi-Fi · audio · battery · date and time</text>
  </g>

  <text x="720" y="674" text-anchor="middle" fill="#888e98" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.6">CONCEPT PREVIEW · NO APPLE LOGO · REAL MENU ACTIONS ARE LINUX DESKTOP ACTIONS</text>
</svg>
