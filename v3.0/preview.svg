<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111522"/>
      <stop offset="0.55" stop-color="#20243a"/>
      <stop offset="1" stop-color="#171c2c"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#8be9d5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8be9d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#c5a3ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c5a3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222a3c" stop-opacity=".94"/>
      <stop offset="1" stop-color="#191f30" stop-opacity=".92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#wallpaper)"/>
  <ellipse cx="340" cy="275" rx="420" ry="340" fill="url(#glowA)" filter="url(#soft)"/>
  <ellipse cx="1190" cy="640" rx="430" ry="360" fill="url(#glowB)" filter="url(#soft)"/>

  <g opacity=".18" fill="none" stroke="#8794b4">
    <circle cx="1100" cy="405" r="300" stroke-width="1"/>
    <circle cx="1100" cy="405" r="240" stroke-width="1"/>
    <circle cx="1100" cy="405" r="180" stroke-width="1"/>
    <path d="M770 405h660M1100 75v660" stroke-width="1"/>
  </g>
  <g opacity=".7">
    <circle cx="1100" cy="405" r="5" fill="#8be9d5"/>
    <circle cx="1100" cy="165" r="4" fill="#c5a3ff"/>
    <circle cx="1280" cy="405" r="4" fill="#8cb8ff"/>
    <circle cx="920" cy="405" r="4" fill="#f5d49a"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="286" y="220" width="868" height="480" rx="18" fill="url(#window)" stroke="#e6eaf2" stroke-opacity=".12"/>
    <path d="M304 220h832a18 18 0 0 1 18 18v44H286v-44a18 18 0 0 1 18-18Z" fill="#ffffff" fill-opacity=".035"/>
    <circle cx="315" cy="248" r="5" fill="#ff8295" opacity=".85"/>
    <circle cx="334" cy="248" r="5" fill="#f5d49a" opacity=".85"/>
    <circle cx="353" cy="248" r="5" fill="#9ce6b0" opacity=".85"/>
    <text x="720" y="253" text-anchor="middle" fill="#a5aec0" font-family="sans-serif" font-size="12" letter-spacing="1.4">MIDNIGHT / AURORA</text>
    <text x="350" y="330" fill="#e6eaf2" font-family="sans-serif" font-size="28" font-weight="500">A quieter kind of focus.</text>
    <text x="350" y="360" fill="#a5aec0" font-family="sans-serif" font-size="14">Your workspace, clear and in balance.</text>
    <rect x="350" y="394" width="770" height="1" fill="#e6eaf2" opacity=".1"/>
    <rect x="350" y="430" width="245" height="196" rx="12" fill="#8be9d5" opacity=".075" stroke="#8be9d5" stroke-opacity=".19"/>
    <text x="374" y="468" fill="#8be9d5" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">NOW PLAYING</text>
    <text x="374" y="516" fill="#e6eaf2" font-family="sans-serif" font-size="21" font-weight="600">Deep work</text>
    <text x="374" y="543" fill="#a5aec0" font-family="sans-serif" font-size="13">Workspace 02  ·  3 windows</text>
    <rect x="374" y="574" width="112" height="28" rx="14" fill="#8be9d5" opacity=".18"/>
    <text x="430" y="593" text-anchor="middle" fill="#8be9d5" font-family="sans-serif" font-size="11" font-weight="600">IN FOCUS</text>
    <rect x="615" y="430" width="505" height="196" rx="12" fill="#ffffff" fill-opacity=".025" stroke="#e6eaf2" stroke-opacity=".09"/>
    <text x="646" y="468" fill="#a5aec0" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">A LITTLE SPACE TO THINK</text>
    <path d="M646 502h440M646 526h370M646 550h405M646 574h330" stroke="#c5a3ff" stroke-opacity=".27" stroke-width="5" stroke-linecap="round"/>
    <path d="M646 502h275M646 526h224M646 550h312M646 574h190" stroke="#e6eaf2" stroke-opacity=".16" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="monospace" font-size="12" font-weight="500">
    <rect x="64" y="35" width="1312" height="48" rx="14" fill="#171d2b" fill-opacity=".91" stroke="#e6eaf2" stroke-opacity=".08"/>
    <rect x="78" y="46" width="176" height="26" rx="9" fill="#222a3b"/>
    <rect x="84" y="51" width="25" height="16" rx="6" fill="#8be9d5"/>
    <text x="96.5" y="63" text-anchor="middle" fill="#111522" font-size="10" font-weight="700">1</text>
    <rect x="113" y="51" width="25" height="16" rx="6" fill="#2c3548"/>
    <text x="125.5" y="63" text-anchor="middle" fill="#e6eaf2">2</text>
    <rect x="142" y="51" width="25" height="16" rx="6" fill="#2c3548"/>
    <text x="154.5" y="63" text-anchor="middle" fill="#e6eaf2">3</text>
    <rect x="171" y="51" width="25" height="16" rx="6" fill="#2c3548"/>
    <text x="183.5" y="63" text-anchor="middle" fill="#e6eaf2">4</text>
    <rect x="200" y="51" width="25" height="16" rx="6" fill="#2c3548"/>
    <text x="212.5" y="63" text-anchor="middle" fill="#e6eaf2">5</text>
    <text x="274" y="65" fill="#e6eaf2">MangoBar — a quiet workspace for focused work</text>

    <rect x="602" y="46" width="114" height="26" rx="9" fill="#222a3b"/>
    <text x="659" y="63" text-anchor="middle" fill="#c5a3ff">Tue, 20 Oct</text>
    <rect x="723" y="46" width="65" height="26" rx="9" fill="#8cb8ff"/>
    <text x="755.5" y="63" text-anchor="middle" fill="#111522" font-weight="700">06:32</text>

    <rect x="980" y="46" width="115" height="26" rx="9" fill="#222a3b"/>
    <text x="1037.5" y="63" text-anchor="middle" fill="#8be9d5">◉ Wi-Fi</text>
    <rect x="1101" y="46" width="73" height="26" rx="9" fill="#222a3b"/>
    <text x="1137.5" y="63" text-anchor="middle" fill="#f5d49a">♫ 42%</text>
    <rect x="1180" y="46" width="66" height="26" rx="9" fill="#222a3b"/>
    <text x="1213" y="63" text-anchor="middle" fill="#8cb8ff">CPU 8%</text>
    <rect x="1252" y="46" width="69" height="26" rx="9" fill="#222a3b"/>
    <text x="1286.5" y="63" text-anchor="middle" fill="#c5a3ff">RAM 36%</text>
    <rect x="1327" y="46" width="36" height="26" rx="9" fill="#c5a3ff"/>
    <text x="1345" y="64" text-anchor="middle" fill="#111522" font-size="17" font-weight="700">⏻</text>
  </g>

  <text x="720" y="842" text-anchor="middle" fill="#a5aec0" font-family="sans-serif" font-size="11" letter-spacing="2.1" opacity=".7">MANGOBAR V3.0  ·  AURORA THEME PREVIEW</text>
</svg>
