[general]
framerate = 30
bars = 16
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 65
